server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    location ~* \.mjs$ {
        types {
            application/javascript mjs;
        }
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
